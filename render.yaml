# Render Blueprint: one free web service (Docker). The database is the free Supabase project,
# so Render never needs a paid database or a payment card.
services:
  - type: web
    name: financial-analysis-platform
    runtime: docker
    plan: free
    region: frankfurt          # same region as the Supabase database (eu-central-1)
    healthCheckPath: /api/auth/status
    envVars:
      - key: DATABASE_URL
        sync: false            # paste the Supabase "Session pooler" URI (with your database password)
      - key: FAP_PASSWORD
        sync: false            # the password people type to sign in to the platform
      - key: FAP_SECRET
        generateValue: true    # random key that signs login sessions
