# Render Blueprint: one web service (Docker) + one PostgreSQL database.
services:
  - type: web
    name: financial-analysis-platform
    runtime: docker
    plan: free
    healthCheckPath: /api/auth/status
    envVars:
      - key: FAP_PASSWORD
        sync: false            # Render asks you to type the password when you create the service
      - key: FAP_SECRET
        generateValue: true    # random key that signs login sessions
      - key: DATABASE_URL
        fromDatabase:
          name: financial-analysis-db
          property: connectionString
databases:
  - name: financial-analysis-db
    plan: free
